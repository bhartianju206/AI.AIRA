name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Checking Java version..."
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected version line: $JAVA_VER_OUTPUT"
          
          MAJOR_VERSION=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          
          if [ -z "$MAJOR_VERSION" ]; then
            echo "ERROR: Failed to detect active Java major version."
            exit 1
          fi
          
          echo "Active Java Major Version: $MAJOR_VERSION"
          
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required. Found version: $MAJOR_VERSION"
            exit 1
          fi
          
          echo "Java environment verified successfully (Java $MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing ./debug.keystore found. Using existing file."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore does not exist and could not be created."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk for diagnostic information:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: Generated APK $TARGET_APK is empty."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: $TARGET_APK does not have .apk extension"; exit 1 ;;
          esac

          echo "APK successfully verified at $TARGET_APK (size: $(wc -c < "$TARGET_APK") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="$TEMP_RELEASE_DIR/app-debug.apk"

          cp "$SOURCE_APK" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Failed to prepare APK release asset at $DEST_APK"
            exit 1
          fi

          echo "apk_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "Release asset prepared: $DEST_APK"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Validating GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.apk_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset validation failed. File missing or empty: $ASSET_PATH"
            exit 1
          fi

          ASSET_FILENAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly 'app-debug.apk'. Found: $ASSET_FILENAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Creating GitHub Release with tag: $RELEASE_TAG and title: $RELEASE_TITLE..."

          NOTES=$(cat << 'EOF'
          ### Debug APK Build

          - **Build System**: Automatically generated debug APK built by GitHub Actions
          - **Workflow Run**: #${{ github.run_number }} (Attempt ${{ github.run_attempt }})
          - **Source Commit**: `${{ github.sha }}`
          - **Intended Use**: Testing and development verification
          - **Production Warning**: This is NOT a Play Store production release
          - **Signing**: Signed exclusively with a temporary debug keystore
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$NOTES"

          echo "Release published successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_STATUS="${{ steps.create_release.outcome }}"

          echo "================================================="
          echo "APK BUILD & RELEASE SUMMARY"
          echo "================================================="

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "GitHub Release created successfully!"
            gh release view "$RELEASE_TAG" || true

            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo ""
            echo "DIRECT APK DOWNLOAD URL:"
            echo "$DIRECT_URL"
            echo "Release Asset Filename: app-debug.apk"
            echo "GitHub Actions backup artifact 'app-debug-apk' is also available."

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "The latest debug APK is available for download at:"
              echo ""
              echo "[**Download app-debug.apk**]($DIRECT_URL)"
              echo ""
              echo "- **Direct URL**: \`$DIRECT_URL\`"
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Backup Artifact**: Actions artifact \`app-debug-apk\` is also preserved."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing did not complete successfully."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "Notice: APK build SUCCEEDED and backup artifact 'app-debug-apk' was uploaded to GitHub Actions."
              echo "The Actions artifact remains available for manual download in this workflow run."
            fi
            echo "The direct latest-release link is not yet active for this run."

            {
              echo "## Release Notice"
              echo ""
              echo "GitHub Release publishing did not complete for this run."
              echo "However, the APK build succeeded and the backup artifact **app-debug-apk** is preserved in GitHub Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "================================================="
